<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />   <stop offset="50%" stop-color="#7F00FF" />  <stop offset="100%" stop-color="#00F2FE" /> </linearGradient>
    
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round">
    
    <path d="M 20,50 C 20,25 45,25 50,50 C 55,75 80,75 80,50" 
          stroke="url(#orbitalGradient)" 
          stroke-width="7" />

    <path d="M 80,50 C 80,25 55,25 50,50 C 45,75 20,75 20,50" 
          stroke="url(#orbitalGradient)" 
          stroke-width="7" 
          stroke-dasharray="1 12" /> <circle cx="50" cy="50" r="6" fill="#00F2FE" filter="url(#coreGlow)" />
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
    
    <circle cx="20" cy="50" r="4" fill="#FF007A" />
    <circle cx="80" cy="50" r="4" fill="#00F2FE" />
  </g>
</svg>